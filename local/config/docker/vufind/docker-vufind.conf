# VuFind 11.1 unter /discovery/ (basierend auf config/vufind/httpd-vufind.conf)
<VirtualHost *:80>
    ServerName performing-arts.eu
    ServerAlias www.performing-arts.eu

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    LogLevel info

    php_admin_flag  log_errors on
    php_admin_value error_log /proc/self/fd/2

    # VuFind-Umgebung (HTTP). Fuer CLI siehe ENV im Dockerfile.
    SetEnv VUFIND_HOME /usr/local/vufind
    SetEnv VUFIND_APPLICATION_PATH /usr/local/vufind
    SetEnv VUFIND_LOCAL_DIR /usr/local/vufind/local
    SetEnv VUFIND_LOCAL_MODULES Fiddk,FiddkApi
    #SetEnv VUFIND_ENV development

    # Theme-Ressourcen
    AliasMatch ^/discovery/themes/([0-9a-zA-Z-_]*)/(assets|css|images|js)/(.*)$ /usr/local/vufind/themes/$1/$2/$3
    <Directory ~ "^/usr/local/vufind/themes/([0-9a-zA-Z-_]*)/(assets|css|images|js)/">
        Require all granted
        AllowOverride All
    </Directory>

    # Public Cache (Asset-Pipeline)
    AliasMatch ^/discovery/cache/(.*)$ /usr/local/vufind/local/cache/public/$1
    <Directory /usr/local/vufind/local/cache/public/>
        Require all granted
        AllowOverride All
    </Directory>

    # VuFind-Basis
    Alias /discovery /usr/local/vufind/public
    <Directory /usr/local/vufind/public/>
        Options +FollowSymLinks -MultiViews
        Require all granted
        AllowOverride All
    </Directory>

    <Location /discovery>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -s [OR]
        RewriteCond %{REQUEST_FILENAME} -l [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^.*$ - [NC,L]
        RewriteRule ^.*$ index.php [NC,L]
    </Location>
</VirtualHost>
