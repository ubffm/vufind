services:
  vufind:
    build:
      context: ../../..
      dockerfile: local/config/docker/vufind/Dockerfile
    container_name: fiddk-vufind
    expose:
      - "80"
    volumes:
      - ./vufind/docker-vufind.conf:/etc/apache2/sites-available/vufind.conf:ro
      - ./vufind/httpd-vufind-local.conf:/etc/apache2/conf-available/vufind.conf:ro
      - ./vufind/99-prod.ini:/usr/local/etc/php/conf.d/99-prod.ini:ro
    command: >
      bash -lc "
        a2dissite 000-default &&
        a2ensite vufind &&
        a2enconf vufind &&
        apache2-foreground
      "
    networks:
      - fiddk_network
    restart: unless-stopped


# bash: docker network create common_network
networks:
  fiddk_network:
    external: true
