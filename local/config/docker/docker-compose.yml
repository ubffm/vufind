services:
  vufind:
    image: docker-vufind:11.1
    build:
      context: ../../..
      dockerfile: local/config/docker/vufind/Dockerfile
    container_name: fiddk-vufind-11.1
    expose:
      - "80"
    volumes:
      - ./vufind/docker-vufind.conf:/etc/apache2/sites-available/vufind.conf:ro
      - ./vufind/99-prod.ini:/usr/local/etc/php/conf.d/99-prod.ini:ro
    environment:
      VUFIND_HOME: /usr/local/vufind
      VUFIND_LOCAL_DIR: /usr/local/vufind/local
      VUFIND_LOCAL_MODULES: Fiddk,FiddkApi
    command: >
      bash -lc "
        a2dissite 000-default &&
        a2ensite vufind &&
        apache2-foreground
      "
    networks:
      - fiddk_network
    restart: unless-stopped


# bash: docker network create common_network
networks:
  fiddk_network:
    external: true
